<body>
    <h1>Parágrafos e quebra de linha </h1>
    <hr>
    <p> Você pode escrever um parágrafo de qualquer jeito, so basta escrever a tag &lt;/p&gt; e digitar!  </p>
    <p> Se precisar quebrar uma linha usamos a tag &lt;/br&gt;, vejamos:</p>
    <p> Julia andou de bicicleta <br> com seu pai</p>
 <hr>
    <p>Agora vamos ver alguns imbolos:
        &reg; &copy; &trade; &euro; &pound; &cent;
        <br> &larr; &rarr;
    </p>
    <p> Emojis:
        &#x1F61C; &#x1F978; &#x1F595; &#x1F596; </p>

</body>
