<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente </h1>
    <p>Este vídeo está hospedado no meu próprio servidor/pasta dentro do ex</p>

    <video width="300" poster="imagens/la.jpg" controls>
        <source src="midia/Meu-Video(1).mp4" type="video/mp4">
        <source src="midia/Meu-Video(1).mkv" type="video/mp4">
        <source src="midia/Meu-Video(1).webm" type="video/webm">
    </video>
    <p>Caso não tenha aparecido nenhum vídeo, sinto lhe dizer que seu navegador não é compativel.</p>

    <h1>Inserindo vídeos do Youtube</h1>
    <iframe width="300" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=TFdwIlkVzAhLxmZF" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
